[package]
name = "pup-portrait-desktop"
version = "1.0.0"
description = "Pup Portrait — AI dog portraits, natively on your desktop"
authors = ["Monomoy Strategies LLC"]
edition = "2021"
rust-version = "1.75"

[lib]
name = "pup_portrait_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-shell = "2.0"
tauri-plugin-updater = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
